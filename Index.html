<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QueueEase</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-stone-50 text-slate-900 font-sans">
  <main class="max-w-5xl mx-auto p-4 md:p-8">

    <!-- Header -->
    <header class="flex flex-wrap items-start justify-between gap-4 mb-8">
      <div>
        <h1 class="text-3xl font-bold tracking-tight">QueueEase</h1>
        <p class="text-slate-500 mt-1">Skip the wait, not the cut.</p>
      </div>
      <div class="flex items-center gap-4">
        <p class="text-lg">Demo clock <span id="clock" class="font-semibold">09:00</span></p>
        <button id="advanceBtn" class="border border-slate-300 rounded-xl px-5 py-2 bg-white hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500">
          Advance 10 min
        </button>
      </div>
    </header>

    <!-- Stats -->
    <section class="grid grid-cols-2 md:grid-cols-4 gap-6 mb-8">
      <div><p class="text-slate-500">Waiting now</p><p id="statWaiting" class="text-4xl font-semibold">0</p></div>
      <div><p class="text-slate-500">Served today</p><p id="statServed" class="text-4xl font-semibold">0</p></div>
      <div><p class="text-slate-500">Avg wait</p><p id="statAvg" class="text-4xl font-semibold">0 min</p></div>
      <div><p class="text-slate-500">Prebooked</p><p id="statPrebooked" class="text-4xl font-semibold">0</p></div>
    </section>

    <div class="grid md:grid-cols-2 gap-6">

      <!-- Staff view -->
      <section class="bg-white border border-slate-200 rounded-3xl p-6">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-xl font-semibold">Staff view</h2>
          <button id="serveNextBtn" class="border border-slate-300 rounded-xl px-4 py-2 hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500">
            Serve next
          </button>
        </div>
        <!-- Progress tracker -->
        <div id="progressBox" class="bg-stone-50 rounded-2xl p-4 mb-4"></div>

        <div class="bg-stone-50 rounded-2xl p-4 mb-4">
          <p class="text-slate-600 mb-2">Service durations (minutes)</p>
          <div id="durations" class="grid grid-cols-3 gap-3"></div>
        </div>

        <ul id="queueList" class="divide-y divide-slate-200 border-t border-slate-200"></ul>

        <div class="border-t border-slate-200 pt-4">
          <p class="text-slate-500 mb-2">Upcoming prebookings</p>
          <ul id="prebookList" class="space-y-1"></ul>
        </div>
      </section>

      <!-- Customer view -->
      <section class="bg-white border border-slate-200 rounded-3xl p-6">
        <h2 class="text-xl font-semibold mb-4">Customer view</h2>

        <input id="nameInput" type="text" placeholder="Your name" autocomplete="off"
          class="w-full border border-slate-200 rounded-xl px-4 py-3 text-lg mb-3 focus:outline-none focus:ring-2 focus:ring-blue-500" />

        <select id="serviceSelect"
          class="w-full border border-slate-200 rounded-xl px-4 py-3 text-lg mb-3 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"></select>

        <div class="flex gap-3 mb-3">
          <button id="joinBtn" class="flex-1 border border-slate-300 rounded-xl px-4 py-3 hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500">
            Join queue now
          </button>
          <select id="slotSelect"
            class="flex-1 border border-slate-200 rounded-xl px-4 py-3 text-lg bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"></select>
        </div>

        <button id="prebookBtn" class="border border-slate-300 rounded-xl px-5 py-3 hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500">
          Prebook
        </button>

        <p id="message" class="text-slate-600 text-lg mt-10" aria-live="polite">Pick a service, then join now or prebook a slot.</p>
        <div id="myTicket" class="mt-6"></div>
      </section>
    </div>

  </main>
  <script src="script.js"></script>
</body>
</html>
